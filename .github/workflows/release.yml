name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: changesets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Trusted publishing needs npm >= 11.5.1; the runner's bundled npm is older.
      - run: npm install -g npm@^11.5.1

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Opens or updates a "Version Packages" PR while changesets are pending;
      # publishes to npm when that PR is merged.
      - uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          # No npm token: the package publishes through npm trusted publishing, which
          # exchanges this job's OIDC identity (id-token: write above) for a short-lived
          # credential and attaches provenance automatically.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
